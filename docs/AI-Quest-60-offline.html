te the WhatsApp message Quest Leaders will post in class groups.”`,suggested:`Polished English copy, lots of emojis, “🚨 LIMITED SEATS! Only 50 spots left, register NOW!”, and a long feature list.`,changed:`Rewrote it in Tenglish and Hinglish (Roman script), which is how students actually text. Killed the fake scarcity: it’s a Zoom call, there’s no real seat limit, and if students catch it, the Quest Leader who forwarded it loses credibility. Replaced it with real deadlines (College Wars closes Day 6, registration closes Day 7). Then, instead of picking one hook, I set up an A/B test between an outcome hook and a placement-pressure hook, tracked through the links.`,why:`Copy that sounds like an ad gets treated like an ad. And I’d rather let 600 visits decide than my own opinion.`},{n:3,sprite:`chest`,topic:`Referral rewards`,asked:`“What rewards should students get for referring friends?”`,suggested:`A lucky draw for an iPad / AirPods for anyone who refers 3+ friends, plus Amazon vouchers for every referral.`,changed:`Chose rewards only the target user values: a placement prompt pack, live project review + certificate of excellence, and a 1:1 mentor review. Cash is limited to the top referrer and top 3 Quest Leaders, inside the ₹2,000. The College Wars prize (an on-campus AI Build Day) is itself a growth channel for NxtWave.`,why:`An iPad attracts people who want an iPad: fake and duplicate sign-ups that never show up. A self-selecting reward keeps the 500 real.`}]}));xt(),Rt();var Fa={"/":Nr,"/join":(0,cn.lazy)(()=>Rr(()=>Promise.resolve().then(()=>(Ur(),zr)),void 0,import.meta.url)),"/pass":(0,cn.lazy)(()=>Rr(()=>Promise.resolve().then(()=>(Bi(),Li)),void 0,import.meta.url)),"/wars":(0,cn.lazy)(()=>Rr(()=>Promise.resolve().then(()=>(Gi(),Vi)),void 0,import.meta.url)),"/leaders":(0,cn.lazy)(()=>Rr(()=>Promise.resolve().then(()=>(Zi(),Ki)),void 0,import.meta.url)),"/whatsapp":(0,cn.lazy)(()=>Rr(()=>Promise.resolve().then(()=>(oa(),U)),void 0,import.meta.url)),"/hq":(
